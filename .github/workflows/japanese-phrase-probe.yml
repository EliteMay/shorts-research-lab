name: Probe natural Japanese phrase boundaries
on:
  push:
    branches: [fix/japanese-conjugation-caption-breaks]
    paths:
      - '.github/workflows/japanese-phrase-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check budoux==0.9.3
      - name: Inspect actual Japanese phrase boundaries
        run: |
          python - <<'PY'
          import json,budoux
          b=budoux.load_default_japanese_parser()
          topics=['ロボットは照れくさそうに笑いました。','鍵はずっと首にかかっていたのです。','ロボットは来た道を走って戻りました。']
          import json
          for topic in topics:
              print(json.dumps({'sentence':topic,'segments':b.parse(topic)},ensure_ascii=False))
          PY
