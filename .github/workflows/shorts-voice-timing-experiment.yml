name: Shorts voice timing experiment
on:
  push:
    branches: [feat/voice-boundary-caption-sync]
    paths:
      - 'studio/voice/**'
      - '.github/workflows/shorts-voice-timing-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests without network
        run: python -m unittest discover -s studio/voice -p 'test_*.py' -v
      - name: Install dependencies
        run: |
          python -m pip install edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate Japanese audio and word-boundary evidence
        run: |
          python studio/voice/edge_sync.py --script studio/evaluation/sample-ja-story.json --out voice-evidence
          ffprobe -v error -show_entries format=duration -of json voice-evidence/voice.wav
      - name: Upload audio and timing evidence (no publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-voice-timing-evidence
          path: voice-evidence/
          if-no-files-found: warn
          retention-days: 3
