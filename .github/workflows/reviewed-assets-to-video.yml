name: Reviewed assets to video integration
on:
  push:
    branches:
      - feat/reviewed-assets-to-video
    paths:
      - 'studio/assets/**'
      - 'studio/voice/**'
      - 'studio/evaluation/reviewed-smoke.mjs'
      - 'studio/tests/stage-reviewed.test.mjs'
      - '.github/workflows/reviewed-assets-to-video.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: Run Node quality gates
        run: npm test
        working-directory: studio
      - name: Run Python review and render unit tests
        run: python -m unittest discover -s studio/voice -p 'test_*.py' -v
      - name: Render two synthetic scenes and validate MP4
        run: node studio/evaluation/reviewed-smoke.mjs
      - name: Independently inspect technical preview
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,width,height -of json reviewed-smoke-output/result/preview.mp4
          test -s reviewed-smoke-output/result/provenance.json
      - name: Save evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-assets-technical-preview-only
          path: |
            reviewed-smoke-output/result/preview.mp4
            reviewed-smoke-output/result/render-report.json
            reviewed-smoke-output/result/provenance.json
          if-no-files-found: warn
          retention-days: 3
