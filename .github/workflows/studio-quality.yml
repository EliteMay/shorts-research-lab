name: Shorts Studio quality gate
on:
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-quality.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-quality.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: studio
      - run: npm run check:example
        working-directory: studio
