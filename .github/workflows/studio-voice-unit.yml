name: Shorts Japanese voice and caption unit tests
on:
  push:
    branches: [main, fix/japanese-conjugation-caption-breaks]
    paths:
      - 'studio/voice/**'
      - '.github/workflows/studio-voice-unit.yml'
  pull_request:
    paths:
      - 'studio/voice/**'
      - '.github/workflows/studio-voice-unit.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic Japanese phrase parser
        run: python -m pip install --disable-pip-version-check budoux==0.9.3
      - name: Validate all Python voice and renderer contracts
        run: python -m unittest discover -s studio/voice -p 'test_*.py' -v
